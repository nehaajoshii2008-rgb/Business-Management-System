<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bms-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bms-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#bms-grad)" filter="url(#shadow)" />
    <!-- Enterprise Diagram / Shield / Chart Icon -->
    <path d="M 28 32 L 50 20 L 72 32 L 72 65 C 72 78 50 86 50 86 C 50 86 28 78 28 65 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 40 60 L 47 67 L 62 48" fill="none" stroke="url(#bms-glow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Analytics nodes inside shield -->
    <circle cx="50" cy="35" r="4" fill="#ffffff"/>
    <circle cx="38" cy="48" r="3.5" fill="#34d399"/>
    <circle cx="62" cy="48" r="3.5" fill="#60a5fa"/>
    <line x1="50" y1="35" x2="38" y2="48" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <line x1="50" y1="35" x2="62" y2="48" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Brand Title Text -->
  <text x="128" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="1">
    ISBMS
  </text>
  <text x="128" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" fill="url(#bms-glow)" letter-spacing="2">
    BUSINESS MANAGEMENT SYSTEM
  </text>
</svg>
