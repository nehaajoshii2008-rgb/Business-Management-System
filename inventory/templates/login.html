{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Login | ISBMS Business Management System</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/bms_icon.svg' %}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 35px;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center mb-2">
                <img src="{% static 'images/bms_icon.svg' %}" alt="BMS Logo" style="height: 56px; width: 56px;" class="rounded-3 shadow">
            </div>
            <h3 class="fw-bold text-white mb-1">Business Portal Login</h3>
            <p class="text-muted small">ISBMS Business Management System</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small fw-bold mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-slate-300 small fw-bold">Username / Mobile Number</label>
                <input type="text" name="username" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Enter username or mobile" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label text-slate-300 small fw-bold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold py-3 mt-2 shadow">
                <i class="bi bi-unlock-fill me-2"></i>Login to POS Terminal
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary">
            <p class="text-muted small mb-0">Don't have an account yet? <a href="{% url 'register' %}" class="text-success fw-bold text-decoration-none">Register New Store</a></p>
        </div>
    </div>
</body>
</html>
